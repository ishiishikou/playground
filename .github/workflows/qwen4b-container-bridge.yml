name: Qwen 4B Container Bridge

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/qwen4b-container-bridge.yml

permissions:
  actions: write
  contents: read

jobs:
  bridge:
    if: github.head_ref == 'tmp-qwen4b-container-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clean previous temporary artifacts
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("qwen4b-part-")) | .id' | while read id; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
          done
      - name: Download model range part 0
        run: |
          set -euxo pipefail
          START=0
          END=440401919
          curl -L --fail --retry 3 --retry-all-errors --range "${START}-${END}" -D headers.txt -o qwen4b.part.0 "https://huggingface.co/bartowski/Qwen_Qwen3.5-4B-GGUF/resolve/main/Qwen_Qwen3.5-4B-Q4_K_M.gguf?download=true"
          test "$(stat -c%s qwen4b.part.0)" -gt 0
          stat -c%s qwen4b.part.0 > PART_SIZE.txt
          sha256sum qwen4b.part.0 > SHA256SUMS.txt
      - name: Download llama.cpp b10809
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 --retry-all-errors -o llama-b10809-bin-ubuntu-x64.tar.gz "https://github.com/ggml-org/llama.cpp/releases/download/b10809/llama-b10809-bin-ubuntu-x64.tar.gz"
          echo "5e34434ddc6d03cd1584f403201aff0d4bd1a5793a72ff7e286532dfd1e4b941  llama-b10809-bin-ubuntu-x64.tar.gz" | sha256sum -c -
      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen4b-part-0
          path: |
            qwen4b.part.0
            PART_SIZE.txt
            SHA256SUMS.txt
            headers.txt
            llama-b10809-bin-ubuntu-x64.tar.gz
          retention-days: 1
          compression-level: 0
