name: Qwen 4B Container Bridge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: [.github/workflows/qwen4b-container-bridge.yml]

permissions:
  actions: write
  contents: read

jobs:
  bridge:
    if: github.head_ref == 'tmp-qwen4b-container-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clean previous temporary artifacts
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("qwen4b-part-")) | .id' | while read id; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
          done
      - name: Download final model range part 6
        run: |
          set -euxo pipefail
          START=2642411520
          END=3082813439
          curl -L --fail --retry 3 --retry-all-errors --range "${START}-${END}" -D headers.txt -o qwen4b.part.6 "https://huggingface.co/bartowski/Qwen_Qwen3.5-4B-GGUF/resolve/main/Qwen_Qwen3.5-4B-Q4_K_M.gguf?download=true"
          test "$(stat -c%s qwen4b.part.6)" -gt 0
          stat -c%s qwen4b.part.6 > PART_SIZE.txt
          sha256sum qwen4b.part.6 > SHA256SUMS.txt
      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen4b-part-6
          path: |
            qwen4b.part.6
            PART_SIZE.txt
            SHA256SUMS.txt
            headers.txt
          retention-days: 1
          compression-level: 0
