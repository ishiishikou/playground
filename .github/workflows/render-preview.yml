name: Render Preview

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/render-preview.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render mobile preview in headless Chrome
        run: |
          python3 -m http.server 8000 >/tmp/particle-http.log 2>&1 &
          sleep 1
          google-chrome --headless --no-sandbox --disable-dev-shm-usage \
            --window-size=430,932 \
            --virtual-time-budget=4200 \
            --screenshot=preview.png \
            http://127.0.0.1:8000/index.html
          test -s preview.png
      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview.png
          git diff --cached --quiet || git commit -m "Update rendered preview"
          git push
