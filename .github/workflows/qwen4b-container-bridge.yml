name: AGMSG Container Bridge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: [.github/workflows/qwen4b-container-bridge.yml]

permissions:
  actions: write
  contents: read

jobs:
  bridge:
    if: github.head_ref == 'tmp-qwen4b-container-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Clean temporary artifacts
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("qwen4b-part-") or .name == "agmsg-container-bridge") | .id' | while read id; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
          done

      - name: Package agmsg and sqlite3
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/fujibee/agmsg.git agmsg
          sudo apt-get update -qq
          sudo apt-get install -y sqlite3
          tar -czf agmsg-main.tar.gz agmsg
          cp "$(command -v sqlite3)" sqlite3
          chmod +x sqlite3
          ./sqlite3 --version > SQLITE_VERSION.txt
          cat agmsg/VERSION > AGMSG_VERSION.txt
          ldd sqlite3 > SQLITE_LDD.txt
          sha256sum agmsg-main.tar.gz sqlite3 > SHA256SUMS.txt

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: agmsg-container-bridge
          path: |
            agmsg-main.tar.gz
            sqlite3
            SQLITE_VERSION.txt
            AGMSG_VERSION.txt
            SQLITE_LDD.txt
            SHA256SUMS.txt
          retention-days: 1
          compression-level: 0
