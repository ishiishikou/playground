name: Qwen Container Bridge

on:
  push:
    branches:
      - tmp-qwen-container-bridge
    paths:
      - .github/workflows/qwen-container-bridge.yml

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download Qwen and prebuilt llama.cpp
        run: |
          mkdir -p payload
          curl -L --fail --retry 3 --retry-delay 2 \
            -o payload/Qwen3.5-0.8B.i1-IQ1_S.gguf \
            'https://huggingface.co/mradermacher/Qwen3.5-0.8B-i1-GGUF/resolve/main/Qwen3.5-0.8B.i1-IQ1_S.gguf'
          curl -L --fail --retry 3 --retry-delay 2 \
            -o payload/llama-b10809-bin-ubuntu-x64.tar.gz \
            'https://github.com/ggml-org/llama.cpp/releases/download/b10809/llama-b10809-bin-ubuntu-x64.tar.gz'
          sha256sum payload/* > payload/SHA256SUMS.txt
          ls -lh payload

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen-container-bridge-prebuilt
          path: payload/
          retention-days: 1
          compression-level: 0
