name: Qwen Container Bridge Cleanup

on:
  push:
    branches:
      - tmp-qwen-container-bridge
    paths:
      - .github/workflows/qwen-container-bridge.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel stale run and delete temporary artifacts
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/34375534970/cancel" || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/10114210436" || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/10114268141" || true
