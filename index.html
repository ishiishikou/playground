<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Particle Type Studies</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.stage{position:relative;width:min(100vw,calc(100vh * 1.5148));aspect-ratio:512/338;overflow:hidden;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.controls{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(18,18,18,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;transition:.2s;pointer-events:none;z-index:3}
body.show-controls .controls{opacity:1;pointer-events:auto}.controls button{border:0;border-radius:999px;background:transparent;color:#aaa;font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:9px 12px}.controls button.active{background:#2b2b2b;color:#fff}
</style>
</head>
<body>
<div class="stage"><canvas id="c" width="512" height="338"></canvas></div>
<div class="controls"><button id="rise">01 RISE</button><button id="glyph">02 GLYPH</button></div>
<script>
(()=>{'use strict';
const W=512,H=338,canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false});
const qs=new URLSearchParams(location.search);let mode=qs.get('mode')==='glyph'?1:0;
const forcedPhase=qs.has('phase')?Math.max(0,Math.min(1,+qs.get('phase'))):null;
const forcedItem=qs.has('item')?Math.max(0,parseInt(qs.get('item'),10)||0):null;
const preview=qs.get('preview')==='1';
const PHRASES=['おどろいた？','HTML　1枚','楽しすぎ'];
const GLYPHS=['文','異','光','影'];
const WHITE_CHARS=Array.from('あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789？！+ー');
const CODE=[
'var canvas=document.createElement("canvas"); var ctx=canvas.getContext("2d");',
'var SCALE=W/2; var DEPTH=0.26, ROUND=0.04; for(var y=0;y<h;y++){',
'for(var x=0;x<w;x++){ var i=(y*w+x)*4; var a=img[i+3]; mask[y*w+x]=a>18; }',
'function sdf(mask,w,h){ var out=new Float32Array(w*h); var INF=1e9;',
'for(var y=0;y<h;y++) for(var x=0;x<w;x++){ var i=y*w+x; var d=mask[i]?INF:0;',
'out[i]=Math.min(d,left+1,up+1,diag+1.414); } return out;',
'var img=ctx.getImageData(0,0,W,H), sdf=distanceField(mask,W,H);',
'function mapGlyph(px,py,z){ var perspective=1/(1.8-z*.62); return [px*perspective,py*perspective]; }',
'var col=shade(normal,light); if(edge<ROUND) col=mix(side,face,edge/ROUND);',
'for(var layer=0;layer<DEPTH;layer+=0.02){ drawCodeTexture(layer); }',
'requestAnimationFrame(render); ctx.fillText(source,rowX,rowY); return frame;',
'const glyphs=["驚","異","光","影"]; const source="文字 → 立体";'
];
let seed=0x137a9b31;function rnd(){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return(seed>>>0)/4294967296}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const smooth=(a,b,x)=>{let t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function fitTextMask(text,w=430,h=120,max=90){const o=document.createElement('canvas');o.width=w;o.height=h;const g=o.getContext('2d',{willReadFrequently:true});g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';let s=max;do{g.font=`900 ${s}px "Noto Sans CJK JP","Hiragino Sans","Yu Gothic",sans-serif`;if(g.measureText(text).width<w*.92)break;s-=2}while(s>42);g.fillText(text,w/2,h/2);const d=g.getImageData(0,0,w,h).data,m=new Uint8Array(w*h);for(let i=0,j=0;i<d.length;i+=4,j++)m[j]=d[i+3]>70?1:0;return{m,w,h}}
function sampleMask(text,count,targetWidth,targetHeight=70,cx=256,cy=164,tail=20){const M=fitTextMask(text),pts=[];for(let y=2;y<M.h-2;y+=2)for(let x=2;x<M.w-2;x+=2)if(M.m[y*M.w+x])pts.push([x,y]);const out=[];for(let i=0;i<count;i++){const q=pts[(rnd()*pts.length)|0];let x=cx+(q[0]/M.w-.5)*targetWidth+(rnd()-.5)*2.2,y=cy+(q[1]/M.h-.5)*targetHeight+(rnd()-.5)*1.6;if(i%17===0){x+=(rnd()-.5)*34;y+=rnd()*tail}out.push({x,y})}return out}
let whiteSets=[];
function buildWhite(){seed=0x14a8f227;const n=1480;whiteSets=[sampleMask(PHRASES[0],n,364,90,252,150,42),sampleMask(PHRASES[1],n,326,50,210,152,10),sampleMask(PHRASES[2],n,340,64,230,146,24)];const parts=[];for(let i=0;i<n;i++){const r=rnd();parts.push({sx:rnd()*W,sy:r<.96?306+Math.pow(rnd(),.68)*31:244+rnd()*63,z:rnd(),d:rnd(),ch:WHITE_CHARS[(rnd()*WHITE_CHARS.length)|0],size:3.5+rnd()*2.8,alpha:.61+rnd()*.23,vis:rnd(),ta:.72+rnd()*.14})}return parts}
const whiteParts=buildWhite();
function easeOutBack(t){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)}
function drawWhite(ph,item){const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#f4f4ef');bg.addColorStop(.64,'#f4f4ef');bg.addColorStop(1,'#dcdcd7');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.fillStyle='#cfcfca';ctx.fillRect(0,0,W,1);const tgt=whiteSets[item];for(let i=0;i<whiteParts.length;i++){const p=whiteParts[i],t=tgt[i];const delay=p.d*.10;let up=smooth(.07+delay,.38+delay,ph),down=smooth(.76+delay*.16,.985,ph),k=up*(1-down);k=clamp(k,0,1);const wob=(1-k)*Math.sin(i*1.73+ph*7)*.9;let x=p.sx+(t.x-p.sx)*k+wob;let y=p.sy+(t.y-p.sy)*k;if(i%19===0){x+=Math.sin(i*.7+ph*5)*7*k;y+=Math.cos(i*.33+ph*4)*7*k}const visible=p.vis<(item===1?.50:.42);const aa=(p.alpha*(1-k)+(visible?p.ta:.025)*k)*(i%23===0?.78:1);ctx.globalAlpha=aa;ctx.fillStyle=k>.55?'#142847':'#25384e';ctx.font=`${Math.max(3.2,p.size*(.92+.08*k)).toFixed(1)}px "Noto Sans CJK JP","Hiragino Sans","Yu Gothic",sans-serif`;ctx.fillText(p.ch,x,y)}ctx.globalAlpha=1;ctx.fillStyle='rgba(75,79,84,.32)';ctx.font='4px "Noto Sans CJK JP","Hiragino Sans","Yu Gothic",sans-serif';ctx.textAlign='center';ctx.fillText('クリック',256,329);ctx.textAlign='start'}
function makeCodeCanvas(bright=false){const o=document.createElement('canvas');o.width=W;o.height=H;const g=o.getContext('2d');g.fillStyle='#0a0d14';g.fillRect(0,0,W,H);g.textBaseline='top';g.font=`${bright?6.8:6.1}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;const lh=bright?5.85:6.5;for(let y=-2,row=0;y<H+10;y+=lh,row++){const line=CODE[row%CODE.length];let s='';while(s.length<180)s+=line+' ';const off=-(row%7)*13-(row%3)*5;g.fillStyle=bright?'#b8bdc1':'#303d4d';g.fillText(s,off,y)}return o}
function drawBackgroundCode(){const grd=ctx.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#090c13');grd.addColorStop(.62,'#090d14');grd.addColorStop(1,'#151a24');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);ctx.textBaseline='top';ctx.font='6.1px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';const lh=6.5;for(let y=-2,row=0;y<H+8;y+=lh,row++){const line=CODE[row%CODE.length];let st='';while(st.length<180)st+=line+' ';const off=-(row%7)*13-(row%3)*5;const a=.34+.16*(y/H)+.18*smooth(.78,1,y/H);ctx.fillStyle=`rgba(52,58,70,${a})`;ctx.fillText(st,off,y)}}
const codeBg=makeCodeCanvas(false),codeFace=makeCodeCanvas(true);
const GLYPH_SPEC=[{sx:1.04,sy:.93,cx:256,cy:169},{sx:1,sy:1,cx:256,cy:173},{sx:.91,sy:1.03,cx:252,cy:178},{sx:1,sy:1,cx:256,cy:175}];const glyphMasks=GLYPHS.map((ch,i)=>{const o=document.createElement('canvas');o.width=W;o.height=H;const g=o.getContext('2d');const q=GLYPH_SPEC[i];g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.save();g.translate(q.cx,q.cy);g.scale(q.sx,q.sy);g.font='900 174px "Noto Sans CJK JP","Hiragino Sans","Yu Gothic",sans-serif';g.fillText(ch,0,0);g.restore();return o});
function clipTexture(texture,mask){const o=document.createElement('canvas');o.width=W;o.height=H;const g=o.getContext('2d');g.drawImage(texture,0,0);g.globalCompositeOperation='destination-in';g.drawImage(mask,0,0);g.globalCompositeOperation='source-over';return o}
const glyphFaces=glyphMasks.map(m=>clipTexture(codeFace,m));
const glyphSides=glyphMasks.map(m=>{const o=document.createElement('canvas');o.width=W;o.height=H;const g=o.getContext('2d');g.fillStyle='#20334b';g.fillRect(0,0,W,H);g.globalCompositeOperation='destination-in';g.drawImage(m,0,0);return o});
function drawTransformed(img,angle,depth,alpha=1){const c=Math.cos(angle),s=Math.sin(angle),cx=256,cy=175;ctx.save();ctx.globalAlpha=alpha;ctx.translate(cx+s*depth,cy);ctx.transform(c,0,0,1,0,0);ctx.translate(-cx,-cy);ctx.drawImage(img,0,0);ctx.restore()}
function drawGlyph(ph,item){ctx.globalAlpha=1;drawBackgroundCode();const enter=smooth(.03,.28,ph),leave=smooth(.78,.985,ph);const hold=enter*(1-leave);const angle=(-1.36*(1-enter))+(1.36*leave);const depth=14*hold;const face=glyphFaces[item],mask=glyphMasks[item];
for(let d=depth;d>0;d-=1.5){drawTransformed(glyphSides[item],angle,d,.13+.22*(1-d/Math.max(depth,1)))}
ctx.save();ctx.filter='blur(2px)';drawTransformed(face,angle,depth,.12*hold);ctx.restore();drawTransformed(face,angle,depth,.96*hold+.04);
if(hold<.98)drawTransformed(clipTexture(codeBg,mask),angle,0,.18*(1-hold));}
let start=performance.now();
function render(now){const dur=mode?4300:7600,total=mode?GLYPHS.length:PHRASES.length,elapsed=now-start,item=forcedItem!==null?forcedItem%total:Math.floor(elapsed/dur)%total,ph=forcedPhase!==null?forcedPhase:(preview?.5:(elapsed%dur)/dur);if(mode)drawGlyph(ph,item);else drawWhite(ph,item);requestAnimationFrame(render)}
function setMode(m){mode=m;start=performance.now();document.getElementById('rise').classList.toggle('active',!m);document.getElementById('glyph').classList.toggle('active',!!m);history.replaceState(null,'',m?'?mode=glyph':'?mode=rise')}
document.getElementById('rise').onclick=()=>setMode(0);document.getElementById('glyph').onclick=()=>setMode(1);let ht;canvas.addEventListener('pointerdown',()=>{document.body.classList.add('show-controls');clearTimeout(ht);ht=setTimeout(()=>document.body.classList.remove('show-controls'),1800)});document.getElementById('rise').classList.toggle('active',!mode);document.getElementById('glyph').classList.toggle('active',!!mode);requestAnimationFrame(render);
})();
</script>
</body></html>
