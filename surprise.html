<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Surprise</title>
<style>
:root{--a:#79f4ff;--b:#a982ff;--c:#ff73b4;--fg:#eef5ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050816;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}.v{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 20% 20%,#79f4ff18,transparent 25%),radial-gradient(circle at 80% 30%,#a982ff18,transparent 25%)}.card{width:min(920px,100%);max-height:92vh;overflow:auto;padding:clamp(20px,4vw,36px);border:1px solid #ffffff22;border-radius:28px;background:#ffffff10;backdrop-filter:blur(20px);box-shadow:0 30px 100px #0008;position:relative}.tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.16em;color:#abc0e8}.dot{width:9px;height:9px;border-radius:50%;background:var(--a);box-shadow:0 0 18px var(--a);animation:p 1.8s infinite}@keyframes p{50%{transform:scale(1.5);opacity:.5}}h1{font-size:clamp(46px,11vw,100px);line-height:.95;letter-spacing:-.06em;margin:18px 0;background:linear-gradient(90deg,#fff,var(--a),var(--b),#fff);background-size:220% 100%;-webkit-background-clip:text;color:transparent;animation:s 7s linear infinite}@keyframes s{to{background-position:220% 0}}p{font-size:clamp(16px,2.3vw,20px);line-height:1.8;color:#dbe7ff}.buttons,.chips{display:flex;gap:10px;flex-wrap:wrap}button{border:1px solid #ffffff22;background:#ffffff12;color:white;padding:12px 16px;border-radius:15px;font-weight:700;font-size:15px;cursor:pointer}.primary{background:linear-gradient(135deg,#79f4ff24,#a982ff2c);box-shadow:0 0 25px #79f4ff22}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:20px}.panel{border:1px solid #ffffff16;background:#ffffff08;border-radius:20px;padding:16px}.term{font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:220px;white-space:pre-wrap;color:#d8f9ff}.fortune{min-height:220px;display:grid;place-items:center;text-align:center;font-size:clamp(22px,3vw,30px);font-weight:800;line-height:1.5}.meter{height:10px;border-radius:99px;background:#ffffff12;overflow:hidden;margin-top:12px}.meter i{display:block;height:100%;width:18%;background:linear-gradient(90deg,var(--a),var(--b),var(--c));transition:.7s;width .7s}.chips{margin-top:14px}.chips button{font-size:13px;padding:9px 12px}.hint{margin-top:14px;font-size:12px;color:#8fa7d4}.toast{position:fixed;z-index:4;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;padding:11px 16px;border-radius:99px;background:#080d20dd;border:1px solid #ffffff22;transition:.3s}.toast.on{opacity:1;transform:translate(-50%,0)}.flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,#fff9,transparent 45%);opacity:0;z-index:3}.flash.on{animation:f .6s}@keyframes f{15%{opacity:1}100%{opacity:0}}@media(max-width:760px){.grid{grid-template-columns:1fr}.card{max-height:95vh}h1{font-size:clamp(50px,17vw,82px)}}
</style>
</head>
<body>
<canvas id="c"></canvas><div class="flash" id="flash"></div>
<main class="v"><section class="card">
<div class="tag"><span class="dot"></span>ONE FILE / ZERO LIBRARIES</div>
<h1>HELLO,<br>FUTURE.</h1>
<p>これはただのHTML 1枚です。なのに、光り、反応し、音を鳴らし、少しだけ重力まで壊します。</p>
<div class="buttons"><button class="primary" id="go">驚かせる</button><button id="chaos">もっと派手に</button><button id="sound">音をつける</button></div>
<div class="grid">
<div class="panel"><div class="term" id="term"></div></div>
<div class="panel"><div class="fortune" id="fortune">静かな画面ほど、派手に裏切る。</div><div class="meter"><i id="meter"></i></div></div>
</div>
<div class="chips"><button data-x="stars">星を増やす</button><button data-x="gravity">重力反転</button><button data-x="glitch">グリッチ</button><button data-x="rainbow">虹色</button><button data-x="calm">落ち着く</button></div>
<div class="hint">画面をタップすると星が弾けます。ダブルタップにも秘密があります。</div>
</section></main><div class="toast" id="toast"></div>
<script>
const $=q=>document.querySelector(q),rnd=(a,b)=>Math.random()*(b-a)+a,pick=a=>a[Math.random()*a.length|0];
const cv=$('#c'),x=cv.getContext('2d'),term=$('#term'),fortune=$('#fortune'),meter=$('#meter'),toast=$('#toast'),flash=$('#flash');
let W,H,D,stars=[],mx=innerWidth/2,my=innerHeight/2,hue=0,grav=1,chaos=false,audio=false,ac;
function resize(){D=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*D;H=cv.height=innerHeight*D;seed(stars.length||170)}
function seed(n){stars=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:rnd(-.12,.12),vy:rnd(-.12,.12),r:rnd(.7,2.2),z:rnd(.3,1.4),t:rnd(0,7)}))}
function burst(px,py,n=32){for(let i=0;i<n;i++){let a=i/n*Math.PI*2,s=rnd(1,4);stars.push({x:px*D,y:py*D,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rnd(1,3),z:rnd(.6,1.8),t:rnd(0,7),life:rnd(45,110)})}}
function draw(){x.clearRect(0,0,W,H);let g=x.createRadialGradient(mx*D,my*D,0,mx*D,my*D,Math.max(W,H)*.6);g.addColorStop(0,`hsla(${190+hue},95%,60%,.11)`);g.addColorStop(.5,`hsla(${270+hue},90%,62%,.07)`);g.addColorStop(1,'transparent');x.fillStyle=g;x.fillRect(0,0,W,H);for(const s of stars){let dx=mx*D-s.x,dy=my*D-s.y,d=Math.hypot(dx,dy)||1,f=Math.min(80/d,1.3)*.06*s.z*grav;s.vx+=dx/d*f;s.vy+=dy/d*f;s.x+=s.vx;s.y+=s.vy;s.vx*=.985;s.vy*=.985;if(s.life!=null)s.life--;if(s.x<0)s.x=W;if(s.x>W)s.x=0;if(s.y<0)s.y=H;if(s.y>H)s.y=0;let a=(.45+Math.sin(performance.now()*.0015+s.t)*.25)*(s.life==null?1:Math.max(0,s.life/110));x.fillStyle=`hsla(${195+hue+s.z*60},100%,78%,${a})`;x.beginPath();x.arc(s.x,s.y,s.r*D,0,7);x.fill();if(chaos){x.strokeStyle=`hsla(${300+hue},100%,75%,${a*.25})`;x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.x-s.vx*8,s.y-s.vy*8);x.stroke()}}stars=stars.filter(s=>s.life==null||s.life>0);requestAnimationFrame(draw)}
function say(t){toast.textContent=t;toast.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('on'),1500)}
function met(n){meter.style.width=n+'%'}
function line(t,d=0){return new Promise(r=>setTimeout(()=>{term.textContent+=t+'\n';term.scrollTop=term.scrollHeight;r()},d))}
async function type(t){for(const c of t){term.textContent+=c;await new Promise(r=>setTimeout(r,14+rnd(0,18)))}term.textContent+='\n'}
function beep(f=440,d=.08){if(!audio)return;ac??=new(window.AudioContext||webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.025;o.connect(g).connect(ac.destination);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}
async function surprise(){flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');term.textContent='';met(12);await line('$ launching surprise.html ...',120);await type('静かに起動しています。');await line('✓ canvas ready');await line('✓ delight engine online');await type('解析結果: このHTMLは、まだ本気を出していません。');met(38);burst(innerWidth/2,innerHeight*.4,90);await type('3...');beep(330);await type('2...');beep(440);await type('1...');beep(660,.15);hue+=80;flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');fortune.textContent=pick(['小さな驚きは、だいたい1ファイルで足りる。','画面の向こう側も、ほんの少し遊んでいる。','コードは静か。でも演出はうるさくていい。']);await line('✦ タップすると星が弾けます。');await line('✦ ダブルタップで秘密があります。');met(76);say('驚きモード起動')}
$('#go').onclick=surprise;$('#chaos').onclick=()=>{chaos=!chaos;hue+=45;for(let i=0;i<10;i++)setTimeout(()=>burst(rnd(0,innerWidth),rnd(0,innerHeight),18),i*40);met(chaos?94:65);fortune.textContent=chaos?'画面が少しうるさい？ それは成功です。':'静けさが戻ると、演出はもっと映える。';say(chaos?'派手モード':'通常モード')};
$('#sound').onclick=async e=>{audio=!audio;if(audio){ac??=new(window.AudioContext||webkitAudioContext)();await ac.resume();e.target.textContent='音を消す';[520,660,880].forEach((f,i)=>setTimeout(()=>beep(f),i*55));say('音をON')}else{e.target.textContent='音をつける';say('音をOFF')}};
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{let a=b.dataset.x;if(a==='stars'){seed(Math.min(stars.length+130,700));burst(innerWidth/2,innerHeight/2,60);met(80)}if(a==='gravity'){grav*=-1;fortune.textContent=grav<0?'引力反転：星があなたから逃げます。':'引力復旧：また近づけます。';met(90)}if(a==='glitch'){let o=fortune.textContent,n=0,t=setInterval(()=>{fortune.textContent=[...o].map(c=>Math.random()<.22?pick([..."█▓▒░<>01未来!?割"]):c).join('');if(++n>9){clearInterval(t);fortune.textContent='正常化完了。ただし世界線が少しズレました。'}},45);met(88)}if(a==='rainbow'){let s=performance.now();(function r(t){hue=(t-s)/7;if(t-s<2600)requestAnimationFrame(r)})(s);fortune.textContent='色が増えると、気分も少し増える。';met(84)}if(a==='calm'){chaos=false;grav=1;hue=0;seed(170);fortune.textContent='静かな画面は、次の驚きの準備でもある。';met(45)}say(b.textContent)});
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});addEventListener('pointerdown',e=>burst(e.clientX,e.clientY,28));let last=0;addEventListener('pointerup',e=>{let now=Date.now();if(now-last<300){grav*=-1;hue+=140;fortune.textContent='秘密発見：この宇宙では、引力すら気分で決まる。';met(100);say('秘密モード')}last=now});
resize();draw();addEventListener('resize',resize);line('$ status');line('✓ single-file page',120);line('✓ interactive universe',240);line('! waiting for curiosity...',360);
</script>
</body>
</html>
