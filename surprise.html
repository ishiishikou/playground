<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>DON'T BLINK</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}body{position:fixed;inset:0}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.grain{position:fixed;inset:-50%;pointer-events:none;opacity:.04;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");animation:grain .18s steps(2) infinite}@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(2%,-3%)}50%{transform:translate(-3%,2%)}75%{transform:translate(3%,3%)}100%{transform:translate(-2%,-2%)}}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 35%,rgba(0,0,0,.18) 65%,rgba(0,0,0,.92) 120%)}#intro{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#000;transition:opacity 1.2s ease,visibility 1.2s}.intro-inner{text-align:center;padding:28px}.tiny{font-size:10px;letter-spacing:.34em;text-transform:uppercase;opacity:.34;margin-bottom:22px}.enter{appearance:none;border:0;background:transparent;color:#fff;padding:28px;cursor:pointer;font:inherit}.enter span{display:block;font-size:clamp(30px,9vw,72px);font-weight:650;letter-spacing:-.05em}.enter i{display:block;width:42px;height:1px;background:#fff;margin:24px auto 0;opacity:.45;animation:breath 1.8s ease-in-out infinite}@keyframes breath{50%{width:90px;opacity:1}}#intro.hide{opacity:0;visibility:hidden}.hud{position:fixed;inset:0;z-index:4;pointer-events:none;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;justify-content:space-between;opacity:0;transition:opacity 1.2s}.hud.on{opacity:1}.top,.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}.sig{font:10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;opacity:.38}.phase{font:10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;opacity:.45}.tools{pointer-events:auto;display:flex;gap:8px}.tool{appearance:none;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.18);backdrop-filter:blur(10px);color:rgba(255,255,255,.65);border-radius:999px;padding:8px 11px;font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}.center{position:fixed;inset:0;z-index:3;pointer-events:none;display:grid;place-items:center;text-align:center;padding:28px}.message{max-width:900px;opacity:0;transform:scale(.96);transition:opacity .8s ease,transform 1.2s cubic-bezier(.2,.8,.2,1);text-shadow:0 0 30px rgba(255,255,255,.16)}.message.show{opacity:1;transform:scale(1)}.message .big{font-size:clamp(36px,11vw,108px);font-weight:700;line-height:.95;letter-spacing:-.065em}.message .sub{margin-top:18px;font-size:clamp(12px,3.7vw,18px);letter-spacing:.08em;opacity:.58;line-height:1.7}.message.glitch .big{animation:glitch .45s steps(2) 1}@keyframes glitch{0%{transform:translate(0)}20%{transform:translate(-8px,3px);filter:hue-rotate(70deg)}40%{transform:translate(9px,-4px)}60%{transform:translate(-4px,-2px);filter:hue-rotate(-90deg)}80%{transform:translate(5px,4px)}100%{transform:translate(0)}}.hold{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 70px);z-index:5;transform:translateX(-50%);font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap}.hold.on{opacity:.42}.flash{position:fixed;inset:0;z-index:20;pointer-events:none;background:#fff;opacity:0}.flash.go{animation:flash .72s ease-out}@keyframes flash{0%{opacity:0}8%{opacity:1}25%{opacity:.32}100%{opacity:0}}.scan{position:fixed;inset:0;pointer-events:none;z-index:2;background:linear-gradient(to bottom,transparent 49.7%,rgba(255,255,255,.03) 50%,transparent 50.3%);background-size:100% 5px;mix-blend-mode:overlay;opacity:.22}.counter{position:fixed;inset:0;z-index:8;display:grid;place-items:center;pointer-events:none;font:900 min(32vw,240px)/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.08em;opacity:0;filter:blur(1px);text-shadow:0 0 80px rgba(255,255,255,.45)}.counter.pop{animation:pop .45s cubic-bezier(.1,.8,.2,1)}@keyframes pop{0%{opacity:0;transform:scale(1.8)}25%{opacity:.95}100%{opacity:0;transform:scale(.55)}}.ringHint{position:fixed;z-index:6;width:78px;height:78px;border-radius:50%;border:1px solid rgba(255,255,255,.35);transform:translate(-50%,-50%) scale(.3);opacity:0;pointer-events:none}.ringHint.go{animation:ring 1s ease-out}@keyframes ring{0%{opacity:.8;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.5)}}@media (prefers-reduced-motion:reduce){.grain{animation:none}.enter i{animation:none}}
</style>
</head>
<body>
<canvas id="space"></canvas>
<div class="scan"></div><div class="grain"></div><div class="vignette"></div>
<div id="intro"><div class="intro-inner"><div class="tiny">one file / no libraries</div><button class="enter" id="enter"><span>触れてください</span><i></i></button></div></div>
<div class="hud" id="hud"><div class="top"><div class="sig" id="sig">SIGNAL 000.000</div><div class="tools"><button class="tool" id="tilt">TILT</button><button class="tool" id="sound">SOUND</button></div></div><div class="bottom"><div class="phase" id="phase">PHASE 0 / 4</div><div class="sig">SURPRISE.HTML</div></div></div>
<div class="center"><div class="message" id="message"><div class="big" id="big"></div><div class="sub" id="sub"></div></div></div>
<div class="hold" id="hold">長押しすると、少し壊れます</div>
<div class="flash" id="flash"></div><div class="counter" id="counter"></div><div class="ringHint" id="ringHint"></div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s),cv=$('#space'),ctx=cv.getContext('2d',{alpha:false}),intro=$('#intro'),enter=$('#enter'),hud=$('#hud'),msg=$('#message'),big=$('#big'),sub=$('#sub'),phaseEl=$('#phase'),sig=$('#sig'),flash=$('#flash'),hold=$('#hold'),counter=$('#counter'),ringHint=$('#ringHint');
let W=0,H=0,D=1,cx=0,cy=0,stars=[],dust=[],ripples=[],trails=[],phase=0,speed=.55,targetSpeed=.55,warp=0,shake=0,hue=205,started=false,last=performance.now(),pointer={x:innerWidth/2,y:innerHeight/2,down:false,sx:0,sy:0,t:0},tilt={x:0,y:0,on:false},tapTimes=[],holdTimer=0,audioOn=true,ac=null,master=null;
const rnd=(a,b)=>Math.random()*(b-a)+a,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){D=Math.min(devicePixelRatio||1,2);W=cv.width=Math.floor(innerWidth*D);H=cv.height=Math.floor(innerHeight*D);cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';cx=W/2;cy=H/2;if(!stars.length)seedStars()}
function seedStars(){stars=Array.from({length:Math.min(900,Math.floor(innerWidth*innerHeight/650))},()=>newStar(true))}
function newStar(randomZ=false){return{x:rnd(-W*.8,W*.8),y:rnd(-H*.8,H*.8),z:randomZ?rnd(1,1400):1400,pz:1400,s:rnd(.35,1.9),h:rnd(-25,35)}}
function resetStar(s){Object.assign(s,newStar(false))}
function burst(x,y,n=55,power=1){const px=x*D,py=y*D;for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),v=rnd(.5,4.8)*D*power;dust.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(28,80),max:80,r:rnd(.6,2.6)*D,h:rnd(-35,70)})}ripples.push({x:px,y:py,r:2,a:.75,w:rnd(1,3)*D})}
function tone(freq=220,d=.1,type='sine',gain=.05,slide=1){if(!audioOn||!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.02)}
function boom(){tone(70,.65,'sine',.16,.42);tone(140,.24,'triangle',.05,2.2);setTimeout(()=>tone(520,.35,'sine',.035,1.9),110)}
function initAudio(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.72;master.connect(ac.destination)}
function whiteFlash(){flash.classList.remove('go');void flash.offsetWidth;flash.classList.add('go')}
function ringAt(x,y){ringHint.style.left=x+'px';ringHint.style.top=y+'px';ringHint.classList.remove('go');void ringHint.offsetWidth;ringHint.classList.add('go')}
function show(title,caption='',glitch=false,ms=2300){big.textContent=title;sub.textContent=caption;msg.classList.toggle('glitch',glitch);msg.classList.add('show');clearTimeout(show.t);show.t=setTimeout(()=>msg.classList.remove('show'),ms)}
function setPhase(n){phase=n;phaseEl.textContent=`PHASE ${n} / 4`;if(n===1)show('これはページではありません。','あなたの指で動く、小さな宇宙です。',false,2800);if(n===2)show('もっと速く。','上へスワイプ。',false,2300);if(n===3){show('今度は、止めてください。','画面のどこかを長押し。',false,3000);hold.classList.add('on')}if(n===4){show('見つけました。','最後の仕掛けは、連打です。',true,3000);hold.classList.remove('on')}}
async function start(){if(started)return;started=true;try{initAudio();await ac.resume()}catch(e){}intro.classList.add('hide');hud.classList.add('on');targetSpeed=2.2;boom();whiteFlash();burst(innerWidth/2,innerHeight/2,130,1.5);setTimeout(()=>setPhase(1),550);setTimeout(()=>{targetSpeed=.72},1800)}
function singularity(x,y){shake=18;warp=1;hue+=120;whiteFlash();boom();for(let i=0;i<8;i++)setTimeout(()=>burst(x,y,70,1.5+i*.08),i*55);show('SINGULARITY','指を離すと、宇宙が戻ります。',true,2200);if(phase<4)setPhase(4)}
function override(){tapTimes=[];shake=28;warp=1.6;targetSpeed=12;whiteFlash();boom();show('SYSTEM OVERRIDE','もうHTMLには見えないはずです。',true,3000);let n=3;const pop=()=>{counter.textContent=n;counter.classList.remove('pop');void counter.offsetWidth;counter.classList.add('pop');tone(180+n*80,.13,'square',.035,1.6);n--;if(n>=0)setTimeout(pop,330);else setTimeout(()=>{counter.textContent='∞';counter.classList.remove('pop');void counter.offsetWidth;counter.classList.add('pop');burst(innerWidth/2,innerHeight/2,260,2.2);tone(880,.8,'sine',.045,.25);setTimeout(()=>{targetSpeed=1.15;warp=.35},1200)},330)};pop()}
function project(s,z=s.z){const f=360*D/(z*.72+1);return{x:cx+s.x*f,y:cy+s.y*f,f}}
function draw(now){const dt=Math.min(2.2,(now-last)/16.67);last=now;speed+=(targetSpeed-speed)*.035*dt;warp*=Math.pow(.987,dt);shake*=Math.pow(.9,dt);const sx=(rnd(-shake,shake))*D,sy=(rnd(-shake,shake))*D;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=`hsl(${(hue+180)%360} 45% 2%)`;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(sx,sy);ctx.globalCompositeOperation='lighter';const fx=(pointer.x-innerWidth/2)*D*.045+(tilt.on?tilt.x*D*1.8:0),fy=(pointer.y-innerHeight/2)*D*.045+(tilt.on?tilt.y*D*1.8:0);for(const s of stars){s.pz=s.z;s.z-=speed*(2.4+s.s*1.7)*dt;if(s.z<1)resetStar(s);const p=project(s),pp=project(s,s.pz);const dx=p.x+fx,dy=p.y+fy,px=pp.x+fx,py=pp.y+fy;if(dx<0||dx>W||dy<0||dy>H){if(s.z<500)resetStar(s);continue}const a=clamp((1-s.z/1400)*.9+.08,.08,.95),r=clamp(s.s*p.f*.8,.55*D,4.8*D);ctx.strokeStyle=`hsla(${hue+s.h},90%,78%,${a})`;ctx.lineWidth=r;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(dx+(dx-cx)*warp*.028,dy+(dy-cy)*warp*.028);ctx.stroke();if(speed<2){ctx.fillStyle=`hsla(${hue+s.h},100%,86%,${a})`;ctx.beginPath();ctx.arc(dx,dy,r*.6,0,Math.PI*2);ctx.fill()}}for(const d of dust){d.x+=d.vx*dt;d.y+=d.vy*dt;d.vx*=.975;d.vy*=.975;d.life-=dt;const a=clamp(d.life/d.max,0,1);ctx.fillStyle=`hsla(${hue+d.h},100%,72%,${a})`;ctx.beginPath();ctx.arc(d.x,d.y,d.r*(.4+a),0,Math.PI*2);ctx.fill()}dust=dust.filter(d=>d.life>0);for(const r of ripples){r.r+=7*D*dt;r.a*=Math.pow(.94,dt);ctx.strokeStyle=`hsla(${hue+40},100%,82%,${r.a})`;ctx.lineWidth=r.w;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke()}ripples=ripples.filter(r=>r.a>.02);if(pointer.down){trails.push({x:pointer.x*D,y:pointer.y*D,l:1});}if(trails.length>42)trails.shift();if(trails.length>1){ctx.lineCap='round';for(let i=1;i<trails.length;i++){const a=i/trails.length*.22;ctx.strokeStyle=`hsla(${hue+80},100%,80%,${a})`;ctx.lineWidth=(i/trails.length)*7*D;ctx.beginPath();ctx.moveTo(trails[i-1].x,trails[i-1].y);ctx.lineTo(trails[i].x,trails[i].y);ctx.stroke()}}trails.forEach(t=>t.l*=.94);trails=trails.filter(t=>t.l>.08);if(warp>.08){const rings=8;for(let i=0;i<rings;i++){const rr=(Math.sin(now*.002+i)*.5+.5)*Math.min(W,H)*(.16+i*.04);ctx.strokeStyle=`hsla(${hue+i*12},100%,75%,${.035+warp*.025})`;ctx.lineWidth=1*D;ctx.beginPath();ctx.ellipse(cx+fx,cy+fy,rr,rr*.62,now*.00015+i*.17,0,Math.PI*2);ctx.stroke()}}ctx.restore();sig.textContent='SIGNAL '+(Math.abs(Math.sin(now*.00071))*999.999).toFixed(3).padStart(7,'0');requestAnimationFrame(draw)}
function pointerDown(e){if(!started)return;pointer.down=true;pointer.x=e.clientX;pointer.y=e.clientY;pointer.sx=e.clientX;pointer.sy=e.clientY;pointer.t=performance.now();ringAt(e.clientX,e.clientY);burst(e.clientX,e.clientY,24,.65);tone(260,.06,'sine',.018,1.5);clearTimeout(holdTimer);holdTimer=setTimeout(()=>{if(pointer.down)singularity(pointer.x,pointer.y)},900)}
function pointerMove(e){pointer.x=e.clientX;pointer.y=e.clientY;if(pointer.down&&Math.random()<.35)burst(e.clientX,e.clientY,3,.28)}
function pointerUp(e){if(!started)return;clearTimeout(holdTimer);pointer.down=false;const dy=e.clientY-pointer.sy,dx=e.clientX-pointer.sx,dur=performance.now()-pointer.t;if(dur<320&&Math.hypot(dx,dy)<24){tapTimes.push(performance.now());tapTimes=tapTimes.filter(t=>performance.now()-t<1600);if(tapTimes.length>=5)override()}if(dy<-90&&Math.abs(dy)>Math.abs(dx)){targetSpeed=clamp(targetSpeed+3,1,14);warp=Math.max(warp,.5);shake=6;show('WARP',`速度 ${targetSpeed.toFixed(1)}×`,'false',1100);tone(320,.3,'sawtooth',.035,3);if(phase<3)setPhase(3);setTimeout(()=>targetSpeed=Math.max(1.1,targetSpeed*.38),1200)}else if(dy>90&&Math.abs(dy)>Math.abs(dx)){targetSpeed=.18;warp=.08;show('SLOW MOTION','時間を薄くしました。',false,1500);tone(240,.45,'sine',.025,.4);setTimeout(()=>targetSpeed=.72,1300)}else if(phase===1){setPhase(2)}}
enter.addEventListener('click',start,{once:true});addEventListener('pointerdown',pointerDown,{passive:true});addEventListener('pointermove',pointerMove,{passive:true});addEventListener('pointerup',pointerUp,{passive:true});addEventListener('pointercancel',pointerUp,{passive:true});
$('#sound').addEventListener('click',async e=>{e.stopPropagation();audioOn=!audioOn;if(audioOn){try{initAudio();await ac.resume();tone(440,.08);tone(660,.12)}catch(_){}}e.currentTarget.textContent=audioOn?'SOUND':'MUTED'});
$('#tilt').addEventListener('click',async e=>{e.stopPropagation();try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')throw 0}tilt.on=!tilt.on;e.currentTarget.textContent=tilt.on?'TILT ON':'TILT';if(tilt.on)show('傾けてください。','端末そのものがコントローラーになります。',false,2200)}catch(_){show('TILT unavailable','この環境では傾きセンサーを使えません。',false,1800)}});
addEventListener('deviceorientation',e=>{if(!tilt.on)return;tilt.x=clamp(e.gamma||0,-25,25);tilt.y=clamp((e.beta||45)-45,-25,25)});
addEventListener('resize',resize);resize();requestAnimationFrame(draw);
setTimeout(()=>{if(!started)enter.querySelector('span').textContent='まだ、触れていません'},6500);
})();
</script>
</body>
</html>
