name: Repack local LLM benchmark artifact

on:
  push:
    branches:
      - bench/decision-only-local-llm
    paths:
      - ".github/workflows/repack-local-llm-artifact.yml"
  workflow_dispatch:

jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Download successful benchmark bundle
        uses: actions/download-artifact@v4
        with:
          name: local-llm-decision-benchmark-bundle
          path: source
          repository: ${{ github.repository }}
          run-id: 35445562908
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Split model into short-transfer chunks
        run: |
          mkdir -p parts
          split -b 150000000 -d -a 2 \
            source/model/Qwen3.5-4B-Q4_K_M.gguf \
            parts/model.part.
          ls -lh parts/model.part.*
          test "$(find parts -maxdepth 1 -name 'model.part.*' | wc -l)" -eq 19

      - name: Upload model part 00
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-model-150m-part-00
          path: parts/model.part.00
          compression-level: 0
          retention-days: 2

      - name: Upload model part 01
        uses: actions/upload-artifact@v4
        with:
          name: local-llm-model-150m-part-01
          path: parts/model.part.01
          compression-level: 0
          retention-days: 2

      - name: Upload model part 02
