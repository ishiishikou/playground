name: AGMSG Container Cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: [.github/workflows/qwen4b-container-bridge.yml]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: github.head_ref == 'tmp-qwen4b-container-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete temporary bridge artifacts
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "agmsg-container-bridge") | .id' | while read id; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" || true
          done
